# Публикация на GitHub Pages. Сейчас сайт публикует Vercel (vercel.json), поэтому запуск только вручную.
# Pages у закрытого репозитория работает только на платном тарифе GitHub.
# Код для входа берётся из секрета APP_CODE (Settings → Secrets and variables → Actions)
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # без кода сайт не публикуем: ждём секрет
  code:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          APP_CODE: ${{ secrets.APP_CODE }}
        run: |
          if [ ${#APP_CODE} -ge 8 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Нет секрета APP_CODE или он короче 8 символов. Сайт не опубликован."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: code
    if: needs.code.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /lit-app/
          APP_CODE: ${{ secrets.APP_CODE }}
      # любая ссылка внутрь приложения открывает его же
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
